<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veterinarian Login — Animal Health Surveillance System</title>
  <meta name="description" content="Secure veterinarian login portal for Animal Health Surveillance System — clinical workspace, AI decision support, and field operations." />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    /* Instant theme application before JS loads (avoids flash) */
    html { transition: background-color 0.25s ease; }
  </style>

  <script>
    // Apply persisted theme immediately to avoid FOUC
    (function() {
      const t = localStorage.getItem('VET_THEME') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/login.js"></script>
  <script type="module">
    import { initLoginPage } from './js/login.js';
    document.addEventListener('DOMContentLoaded', initLoginPage);
  </script>
</body>
</html>
